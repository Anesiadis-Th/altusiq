name: Deploy Backend to Fly.io

on:
  push:
    branches:
      - master
    # Docs never ship, so a README or ADR edit should not start this workflow at all. A push that touches docs AND code still runs: paths-ignore only skips when every changed file matches.
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
      - ".gitignore"
  workflow_dispatch:

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  changes:
    name: Detect backend changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.check.outputs.backend }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: check
        run: |
          base="${{ github.event.before }}"
          if [ -z "$base" ] \
            || [ "$base" = "0000000000000000000000000000000000000000" ] \
            || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "no usable base ref, deploying"
            echo "backend=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$base" "${{ github.sha }}" | grep -qE '^backend/'; then
            echo "backend changed, deploying"
            echo "backend=true" >> "$GITHUB_OUTPUT"
          else
            echo "no backend changes, skipping deploy"
            echo "backend=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: [ci, changes]
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io
        run: flyctl deploy --remote-only
        working-directory: backend
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
