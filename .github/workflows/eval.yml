name: Investigation eval

# Runs the recorded cases through the production agent. Replay mode also runs
# in CI (ci.yml); this workflow is for live runs against a real provider.
#
# Live mode needs LLM_API_KEY and LLM_PROVIDER, and is capped at 40 model calls,
# 10 per case. The workflow is manual-only because free quotas are per account:
# a scheduled live run on the production account would use requests the deployed
# investigation service needs (OpenRouter's free tier allows 50 a day). Local
# runs against Ollama (LLM_BASE_URL, LLM_MODEL) use neither quota.

on:
  workflow_dispatch:

jobs:
  eval:
    name: Run and score
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore AltusIQ.sln
        working-directory: backend

      - name: Build
        run: dotnet build AltusIQ.sln --configuration Release --no-restore
        working-directory: backend

      - name: Run eval
        run: dotnet run --project AltusIQ.Evals --configuration Release --no-build -- --results results
        working-directory: backend
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: backend/results/*.json
          if-no-files-found: error
